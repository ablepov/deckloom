name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/pptx-backend --ignore-scripts
      - run: npm audit --prefix tools/pptx-backend --audit-level=high
      - run: npm run check:pptx-backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.9.2 PyMuPDF==1.27.2.2 Pillow==12.3.0
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run check:export
      - run: npm run check:pptx
      - run: npm run render:example
      - run: npm run check:baseline:ci
      - run: npm run check:package
      - run: npm pack --dry-run
