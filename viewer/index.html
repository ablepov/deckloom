<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__DECKLOOM_TITLE__</title>
    __DECKLOOM_FAVICON__
    <style>
      :root {
        --bg: #0d1014;
        --panel: #151a21;
        --panel-strong: #1d232c;
        --line: rgba(255, 255, 255, 0.14);
        --line-strong: rgba(239, 174, 114, 0.6);
        --text: #f5f0e8;
        --muted: rgba(245, 240, 232, 0.66);
        --accent: #efae72;
        --stage: #05070a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        background: linear-gradient(180deg, #10141a, var(--bg));
        font-family:
          "Wix Madefor Display",
          "Geologica",
          "Segoe UI",
          Arial,
          sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        --topbar-height: 64px;
        min-height: 100vh;
      }

      .topbar {
        position: relative;
        z-index: 40;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 24px;
        min-height: 64px;
        padding: 10px 24px;
      }

      .brand {
        min-width: 0;
      }

      .deck-picker {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        cursor: pointer;
      }

      .deck-title {
        min-width: 0;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      .deck-picker svg {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .deck-picker select {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-width: 0;
        border: 0;
        padding: 0;
        opacity: 0;
        cursor: pointer;
      }

      .deck-picker:has(select:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .deck-picker option {
        color: #151a21;
        background: #fff;
      }

      .status {
        margin-top: 3px;
        min-width: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mode-group,
      .jump {
        display: flex;
        align-items: center;
      }

      .mode-group {
        gap: 2px;
      }

      .header-actions { display: flex; align-items: center; gap: 14px; }
      .download-control { position: relative; }
      .button.download-trigger { width: auto; gap: 7px; padding: 0 10px; color: var(--text); border: 1px solid var(--line); }
      .download-trigger:disabled { opacity: .45; cursor: default; }
      .download-trigger .download-label { width: 64px; text-align: left; }
      .download-trigger .icon-loader { display: none; }
      .download-trigger[aria-busy="true"] { opacity: 1; cursor: progress; background: var(--panel-strong); border-color: var(--line-strong); }
      .download-trigger[aria-busy="true"] .icon-download { display: none; }
      .download-trigger[aria-busy="true"] .icon-loader { display: block; animation: download-spin 1s linear infinite; transform-origin: center; }
      .download-trigger[aria-busy="true"] .chevron { visibility: hidden; }
      @keyframes download-spin { to { transform: rotate(360deg); } }
      .download-trigger[aria-expanded="true"] { background: var(--panel-strong); border-color: var(--line-strong); }
      .download-trigger .chevron { width: 12px; height: 12px; }
      .download-menu { position: absolute; top: calc(100% + 8px); right: 0; width: min(310px, calc(100vw - 28px)); padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 12px 32px #0006; z-index: 40; }
      [hidden] { display: none !important; }
      .download-item { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; width: 100%; min-height: 40px; padding: 10px; border: 0; border-radius: 6px; text-align: left; color: var(--text); background: transparent; cursor: pointer; font-size: 13px; }
      .download-item:hover:not(:disabled), .download-item:focus-visible { background: var(--panel-strong); outline: 1px solid var(--line-strong); outline-offset: -1px; }
      .download-item:disabled { color: var(--muted); cursor: default; }
      .download-item small { flex-basis: 100%; font-size: 11px; color: var(--muted); }
      .download-item.google { border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; margin-top: 4px; padding-top: 13px; }
      .beta { padding: 2px 5px; border-radius: 4px; font-size: 10px; line-height: 1.2; color: var(--accent); background: #efae7214; }
      .download-notice { position: fixed; z-index: 35; top: calc(var(--topbar-height) + 8px); right: 24px; width: min(360px, calc(100vw - 28px)); padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 8px 24px #0005; font-size: 12px; line-height: 1.5; }
      .download-notice p { margin: 0; overflow-wrap: anywhere; }
      .download-notice a, .download-notice button { display: inline-block; margin: 6px 12px 0 0; padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; }
      .download-notice button:focus-visible, .download-notice a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .button,
      .slide-tab {
        border: 0;
        color: var(--text);
        background: transparent;
        cursor: pointer;
      }

      .button {
        width: 34px;
        height: 32px;
        padding: 0;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .button svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .button {
        color: var(--muted);
      }

      .button:hover {
        color: var(--text);
      }

      .button:focus-visible,
      .slide-tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .button[aria-pressed="true"] {
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
      }

      .jump {
        position: relative;
        z-index: 1;
        gap: 6px;
        min-width: 0;
        max-width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        padding: 24px 44px 12px;
        scroll-padding-inline: 44px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }

      .slide-tab {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border: 0;
        padding: 0;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        transform-origin: center bottom;
        transform: translateX(var(--dock-shift, 0px)) scale(var(--dock-scale, 1));
        transition: transform 100ms ease-out, color 140ms ease;
      }

      .slide-tab:hover,
      .slide-tab[aria-current="true"] {
        color: var(--accent);
      }

      .slide-tab[aria-current="true"] {
        font-weight: 750;
      }

      .slide-number {
        position: relative;
        display: inline-block;
        z-index: 1;
      }

      .slide-tab:focus-visible {
        --dock-scale: 1.3;
      }

      .slide-dock {
        position: fixed;
        z-index: 30;
        bottom: 10px;
        left: 50%;
        width: max-content;
        max-width: calc(100% - 32px);
        transform: translate(-50%, 6px);
        transition: transform 180ms ease;
      }

      .slide-dock:hover,
      .slide-dock:focus-within {
        transform: translate(-50%, 0);
      }

      .slide-indicator {
        position: absolute;
        z-index: 0;
        left: 0;
        bottom: -10px;
        width: 1px;
        height: 80px;
        border-radius: 2px 2px 0 0;
        background: #fff;
        mask-image: linear-gradient(to bottom, #000 var(--indicator-gap-start, 0px), transparent var(--indicator-gap-start, 0px), transparent var(--indicator-gap-end, 0px), #000 var(--indicator-gap-end, 0px));
        opacity: 0;
        pointer-events: none;
        transform: translateX(calc(var(--indicator-x, 0px) - 0.5px));
        transition: transform var(--indicator-duration, 260ms) ease-out;
      }

      .slide-indicator.is-visible {
        opacity: 1;
      }

      .many-slides .jump {
        gap: 3px;
      }

      .many-slides .slide-tab {
        width: 24px;
        font-size: 11px;
      }

      .app > main {
        width: min(100%, 1980px);
        margin: 0 auto;
        padding: 20px 24px 100px;
      }

      .slides {
        display: grid;
        gap: 32px;
      }

      .slide-card {
        display: grid;
        gap: 0;
        margin: 0;
      }

      .deck-mode .slide-card {
        cursor: pointer;
      }

      .deck-mode .slide-card:hover .stage,
      .deck-mode .slide-card:focus-visible .stage {
        border-color: var(--line-strong);
      }

      .slide-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
      }

      h2 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
      }

      .meta {
        min-width: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage {
        position: relative;
        overflow: hidden;
        width: 100%;
        aspect-ratio: var(--slide-aspect, 16 / 9);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: var(--stage);
      }

      .stage img,
      .html-inline {
        display: block;
        width: 100%;
        height: 100%;
      }

      .stage img {
        object-fit: contain;
      }

      .html-inline {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Inline slide DOM keeps text selectable; injected CSS is scoped per slide. */
      .html-inline-holder {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--slide-width, 1920px);
        height: var(--slide-height, 1080px);
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--stage);
        isolation: isolate;
        user-select: text;
      }

      .html-inline-error {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
        text-align: center;
      }

      .html-document-frame { width: 100%; height: 100%; border: 0; display: block; background: white; }

      .app.focus-mode > main {
        width: min(100%, 1720px);
        min-height: calc(100dvh - var(--topbar-height) - 84px);
        display: grid;
        align-content: center;
        padding: 16px 24px;
      }

      .focus-mode .slides {
        display: block;
      }

      .focus-mode .slide-card {
        display: none;
      }

      .focus-mode .slide-card.is-active {
        display: grid;
        justify-items: center;
      }

      .focus-mode .stage {
        width: min(100%, calc((100dvh - var(--topbar-height) - 116px) * var(--slide-aspect, 16 / 9)));
      }

      .deck-mode .slides {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr));
      }

      .empty {
        display: grid;
        min-height: 320px;
        place-items: center;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }

      .is-loading .status {
        color: var(--accent);
      }

      @media (max-width: 900px) {
        .topbar {
          gap: 12px;
        }

      }

      @media (max-width: 560px) {
        .topbar,
        .app > main,
        .app.focus-mode > main {
          padding-left: 14px;
          padding-right: 14px;
        }

        .topbar {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 8px;
        }

        .deck-title {
          font-size: 18px;
        }
        .header-actions { gap: 6px; }
        .download-trigger span { display: none; }
        .download-notice { right: 14px; }

        .slide-head {
          display: grid;
          gap: 4px;
        }

        .meta {
          text-align: left;
        }

        .slide-dock {
          max-width: calc(100% - 20px);
        }

      }

      @media (prefers-reduced-motion: reduce) {
        .download-trigger[aria-busy="true"] .icon-loader { animation: none; }
        .slide-dock,
        .slide-dock .jump,
        .slide-dock .slide-indicator,
        .slide-dock .slide-tab {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app focus-mode is-loading" id="app">
      <header class="topbar">
        <div class="brand">
          <label class="deck-picker" for="deckSelect">
            <span class="deck-title" id="deckTitle" aria-hidden="true">Загрузка…</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            <select id="deckSelect" aria-label="Выбрать презентацию">
              <option>Загрузка…</option>
            </select>
          </label>
          <div class="status" id="status">Загрузка слайдов…</div>
        </div>

        <div class="header-actions"><div class="mode-group" role="group" aria-label="Режим просмотра">
          <button class="button" type="button" id="focusMode" aria-label="Листать" title="Листать — стрелками или колёсиком" aria-pressed="true"></button>
          <button class="button" type="button" id="deckMode" aria-label="Обзор" title="Обзор всех слайдов" aria-pressed="false"></button>
        </div>
        <div class="download-control" id="downloadControl">
          <button class="button download-trigger" id="downloadButton" type="button" aria-label="Скачать выбранную колоду" title="Скачать выбранную колоду" aria-haspopup="menu" aria-expanded="false" aria-controls="downloadMenu" disabled></button>
          <div class="download-menu" id="downloadMenu" role="menu" aria-label="Скачать выбранную колоду" hidden>
            <button class="download-item" type="button" role="menuitem" tabindex="-1" data-download="pdf">Скачать PDF</button>
            <button class="download-item" type="button" role="menuitem" tabindex="-1" data-download="pptx">Скачать PPTX</button>
            <button class="download-item" type="button" role="menuitem" tabindex="-1" data-download="pptx-fonts">Скачать PPTX со шрифтами <small>ZIP-архив с файлами для установки</small></button>
            <button class="download-item google" type="button" role="menuitem" tabindex="-1" disabled aria-disabled="true" title="Интеграция появится позже">Открыть в Google Презентациях <span class="beta">Бета</span><small>Скоро. Пока недоступно</small></button>
          </div>
        </div></div>
      </header>
      <div class="download-notice" id="downloadNotice" role="status" aria-live="polite" hidden></div>

      <main>
        <div class="slides" id="slides"></div>
      </main>

      <nav class="slide-dock" id="slideDock" aria-label="Номера слайдов">
        <span class="slide-indicator" id="slideIndicator" aria-hidden="true"></span>
        <div class="jump" id="jump"></div>
      </nav>
    </div>

    <script>window.deckloomConfig = __DECKLOOM_CONFIG__;</script>
    <script>
      const inspectStaticDocument = __DECKLOOM_PROFILE__;
      const app = document.getElementById("app");
      const deckSelect = document.getElementById("deckSelect");
      const deckTitleNode = document.getElementById("deckTitle");
      const slidesRoot = document.getElementById("slides");
      const jumpRoot = document.getElementById("jump");
      const slideDock = document.getElementById("slideDock");
      const slideIndicator = document.getElementById("slideIndicator");
      const statusNode = document.getElementById("status");
      const focusButton = document.getElementById("focusMode");
      const deckButton = document.getElementById("deckMode");
      const downloadButton = document.getElementById('downloadButton');
      const downloadMenu = document.getElementById('downloadMenu');
      const downloadControl = document.getElementById('downloadControl');
      const downloadNotice = document.getElementById('downloadNotice');
      const downloadState = { busy:false, capabilities:[], failed:null };

      const config = window.deckloomConfig || {};
      const apiUrl = suffix => `${config.apiBase || '/api'}${suffix}`;
      const storagePrefix = config.storagePrefix || "deckloom";
      // Embedded browsers may deny storage. Viewing and presenting still work in memory.
      const storage = {
        getItem(key) { try { return localStorage.getItem(key); } catch { return null; } },
        setItem(key, value) { try { localStorage.setItem(key, value); } catch { /* Optional view persistence. */ } },
      };
      const state = {
        decks: [],
        deckId: storage.getItem(`${storagePrefix}Deck`) || "",
        slides: [],
        index: 0,
        mode: storage.getItem(`${storagePrefix}Mode`) || "focus",
        signature: "",
        decksSignature: null,
        contractVersion: 0,
        project: null,
        generatedAt: "",
        requestInFlight: false,
        presenting: false,
        updatesHeld: false,
        readEpoch: 0,
      };
      let readAbort;

      const dockState = { hovered: false, frame: 0, pointerX: 0 };
      const wheelState = { lastEvent: 0, direction: 0, distance: 0, consumed: false };
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let indicatorX = null;
      let indicatorCutoutFrame = 0;
      let indicatorCutoutUntil = 0;

      function syncIndicatorCutout() {
        const label = jumpRoot.querySelector('.slide-tab[aria-current="true"] .slide-number');
        if (label) {
          const number = label.getBoundingClientRect();
          const line = slideIndicator.getBoundingClientRect();
          slideIndicator.style.setProperty("--indicator-gap-start", `${Math.max(0, number.top - line.top - 2)}px`);
          slideIndicator.style.setProperty("--indicator-gap-end", `${Math.min(line.height, number.bottom - line.top + 2)}px`);
        }
        indicatorCutoutFrame = performance.now() < indicatorCutoutUntil
          ? requestAnimationFrame(syncIndicatorCutout) : 0;
      }

      function syncSlideIndicator({ navigation = false, instant = false } = {}) {
        const activeTab = jumpRoot.querySelector('.slide-tab[aria-current="true"]');
        if (!activeTab) {
          slideIndicator.classList.remove("is-visible");
          return;
        }
        // Match the number's target transform; the strip's own movement is shared.
        const shift = parseFloat(activeTab.style.getPropertyValue("--dock-shift")) || 0;
        const center = activeTab.offsetLeft + activeTab.offsetWidth / 2 - jumpRoot.scrollLeft + shift;
        const visible = center >= 0 && center <= jumpRoot.clientWidth;
        const x = Math.max(0, Math.min(center, jumpRoot.clientWidth));
        slideIndicator.classList.toggle("is-visible", visible);
        // Keep the white line out of the number's text area, including during zoom.
        indicatorCutoutUntil = performance.now() + 140;
        if (!indicatorCutoutFrame) syncIndicatorCutout();
        if (indicatorX === x) return;
        const duration = indicatorX === null || instant ? 0 : navigation ? 260 : 100;
        slideIndicator.style.setProperty("--indicator-duration", `${duration}ms`);
        slideIndicator.style.setProperty("--indicator-x", `${x.toFixed(2)}px`);
        indicatorX = x;
      }

      function resetDockMagnification({ instant = false } = {}) {
        cancelAnimationFrame(dockState.frame);
        dockState.frame = 0;
        jumpRoot.querySelectorAll(".slide-tab").forEach((button) => {
          button.style.removeProperty("--dock-scale");
          button.style.removeProperty("--dock-shift");
        });
        syncSlideIndicator({ instant });
      }

      function magnifyDock() {
        dockState.frame = 0;
        if (reducedMotion.matches || !dockState.hovered) return;
        const pointerX = dockState.pointerX - jumpRoot.getBoundingClientRect().left + jumpRoot.scrollLeft;
        // Measure untransformed positions so magnification never moves its own target.
        const buttons = Array.from(jumpRoot.querySelectorAll(".slide-tab"));
        const sizes = buttons.map((button) => {
          const width = button.offsetWidth;
          const distance = Math.abs(button.offsetLeft + width / 2 - pointerX);
          const influence = distance < 88 ? (1 + Math.cos(Math.PI * distance / 88)) / 2 : 0;
          const scale = 1 + influence * 0.6;
          return { scale, extra: width * (scale - 1) };
        });
        const extraWidth = sizes.reduce((sum, size) => sum + size.extra, 0);
        let offset = -extraWidth / 2;
        buttons.forEach((button, index) => {
          const size = sizes[index];
          button.style.setProperty("--dock-scale", size.scale.toFixed(3));
          button.style.setProperty("--dock-shift", `${(offset + size.extra / 2).toFixed(2)}px`);
          offset += size.extra;
        });
        syncSlideIndicator();
      }

      slideDock.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "touch") return;
        dockState.hovered = true;
      });
      slideDock.addEventListener("pointerleave", () => {
        dockState.hovered = false;
        resetDockMagnification();
      });
      jumpRoot.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch") return;
        dockState.pointerX = event.clientX;
        if (!dockState.frame) dockState.frame = requestAnimationFrame(magnifyDock);
      });
      jumpRoot.addEventListener("pointerleave", resetDockMagnification);
      jumpRoot.addEventListener("scroll", () => resetDockMagnification({ instant: true }));
      reducedMotion.addEventListener("change", resetDockMagnification);

      function syncViewerHeight() {
        app.style.setProperty("--topbar-height", `${document.querySelector(".topbar").offsetHeight}px`);
        scheduleHtmlFrameScale();
      }
      new ResizeObserver(syncViewerHeight).observe(document.querySelector(".topbar"));

      // Lucide SVG geometry, pinned source and license: viewer/icons/.
      const toolbarIconMarkup = {
        layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/>',
        grid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
        download: '<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
        loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
        chevron: '<path d="m6 9 6 6 6-6"/>',
      };

      function icon(kind) {
        return `<svg class="icon-${kind}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${toolbarIconMarkup[kind]}</svg>`;
      }

      focusButton.innerHTML = icon('layers');
      deckButton.innerHTML = icon('grid');
      downloadButton.innerHTML = icon('download')+icon('loader')+'<span class="download-label">Скачать</span>'+icon('chevron').replace('icon-chevron','icon-chevron chevron');

      function closeDownloadMenu(restoreFocus=false) {
        downloadMenu.hidden=true;downloadButton.setAttribute('aria-expanded','false');
        if(restoreFocus)downloadButton.focus();
      }
      function syncDownloads() {
        const capability=downloadState.capabilities.find(c=>c.deckId===state.deckId);
        downloadButton.disabled=downloadState.busy||!(capability?.pdf||capability?.pptx||capability?.fonts)||!state.slides.length;
        downloadButton.setAttribute('aria-busy',String(downloadState.busy));
        downloadButton.querySelector('.download-label').textContent=downloadState.busy?'Готовим…':'Скачать';
        const downloadLabel=downloadState.busy?'Готовим файл выбранной колоды':'Скачать выбранную колоду';
        downloadButton.setAttribute('aria-label',downloadLabel);
        downloadButton.title=downloadLabel;
        for(const item of downloadMenu.querySelectorAll('[data-download]')){
          const available=item.dataset.download==='pdf'?capability?.pdf:item.dataset.download==='pptx'?capability?.pptx:capability?.fonts;
          item.disabled=!available;
          item.title=available?'':item.dataset.download==='pptx-fonts'?'Установочные шрифты для этой колоды пока не настроены':'Экспорт этой колоды пока не поддерживается';
        }
        if(downloadButton.disabled)closeDownloadMenu();
      }
      function showDownloadNotice(text,options={}) {
        if(options.progress){const p=downloadNotice.querySelector('p');if(p&&p.textContent!==text)p.textContent=text;return;}
        downloadNotice.replaceChildren();const p=document.createElement('p');p.textContent=text;downloadNotice.append(p);
        if(options.url){const a=document.createElement('a');a.href=options.url;a.download=options.filename;a.textContent='Скачать ещё раз';downloadNotice.append(a);}
        if(options.retry){const retry=document.createElement('button');retry.type='button';retry.textContent='Повторить';retry.onclick=()=>startDownload(options.retry.format,options.retry.deckId);downloadNotice.append(retry);}
        const hide=document.createElement('button');hide.type='button';hide.textContent='Скрыть';hide.onclick=()=>downloadNotice.hidden=true;downloadNotice.append(hide);downloadNotice.hidden=false;
      }
      async function startDownload(format,deckId=state.deckId) {
        if(downloadState.busy)return;
        const deck=state.decks.find(d=>d.id===deckId);if(!deck)return;
        const kind=format==='pdf'?'PDF':format==='pptx'?'PPTX':'ZIP со шрифтами';
        const capability=downloadState.capabilities.find(c=>c.deckId===deckId);
        if(capability?.mode==='ready'){
          const link=capability.links?.[format];
          if(!link||typeof link.url!=='string')return;
          const target=new URL(link.url,location.href);
          if(target.protocol!=='https:'&&!(target.protocol==='http:'&&target.origin===location.origin))return;
          closeDownloadMenu(true);
          const a=document.createElement('a');a.href=target.href;a.download=link.filename||'';a.rel='noopener';document.body.append(a);a.click();a.remove();
          showDownloadNotice(`Скачивание ${kind} · ${deck.label}`,{url:target.href,filename:link.filename});return;
        }
        closeDownloadMenu(true);downloadState.busy=true;syncDownloads();
        showDownloadNotice(`Готовим ${kind} · ${deck.label}…`);
        try{
          const response=await fetch(apiUrl('/downloads'),{method:'POST',signal:AbortSignal.timeout(30000),headers:{'Content-Type':'application/json','X-Deckloom-Token':config.downloadToken},body:JSON.stringify({deckId,format})});
          let job=await response.json();if(!response.ok)throw Object.assign(new Error('Export failed'),{code:job.code});
          const deadline=Date.now()+15*60*1000;
          while(!['complete','failed'].includes(job.state)){
            if(Date.now()>deadline)throw new Error('Export timed out');
            await new Promise(resolve=>setTimeout(resolve,700));
            const poll=await fetch(apiUrl(`/downloads/${job.id}`),{cache:'no-store',signal:AbortSignal.timeout(30000)});if(!poll.ok)throw new Error('Export status unavailable');job=await poll.json();
            if(job.progress?.stage==='render')showDownloadNotice(`Готовим ${kind} · ${deck.label}: ${job.progress.completed} из ${job.progress.total} слайдов`,{progress:true});
            else if(job.progress?.stage==='pptx')showDownloadNotice(`Собираем ${kind} · ${deck.label}…`,{progress:true});
          }
          if(job.state==='failed')throw Object.assign(new Error('Export failed'),job.error);
          const a=document.createElement('a');a.href=job.url;a.download=job.filename;document.body.append(a);a.click();a.remove();
          showDownloadNotice(`${kind} готов · ${deck.label}`,{url:job.url,filename:job.filename});
        }catch(error){
          const reason=error.code==='DOWNLOAD_BUSY'?'Другая колода уже экспортируется. Дождитесь завершения.':error.code==='PPTX_UNSUPPORTED_CANVAS'||error.code?.startsWith('PPTX_UNSUPPORTED')?'Эта композиция пока не поддерживается в PPTX.':error.code==='FONT_PACKAGE_UNAVAILABLE'||error.code==='FONT_REDISTRIBUTION_UNCONFIRMED'?'Установочные шрифты для этой колоды пока недоступны.':'Попробуйте ещё раз.';
          showDownloadNotice(`Не удалось подготовить ${kind} · ${deck.label}. ${reason}`,{retry:{format,deckId}});
        }finally{downloadState.busy=false;syncDownloads();}
      }
      downloadButton.addEventListener('click',()=>{
        if(!downloadMenu.hidden)return closeDownloadMenu();
        downloadMenu.hidden=false;downloadButton.setAttribute('aria-expanded','true');downloadMenu.querySelector('button:not(:disabled)')?.focus();
      });
      downloadButton.addEventListener('keydown',event=>{
        if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();downloadMenu.hidden=false;downloadButton.setAttribute('aria-expanded','true');const items=[...downloadMenu.querySelectorAll('button:not(:disabled)')];(event.key==='ArrowUp'?items.at(-1):items[0])?.focus();}
      });
      downloadMenu.addEventListener('click',event=>{const item=event.target.closest('[data-download]');if(item&&!item.disabled)startDownload(item.dataset.download);});
      downloadMenu.addEventListener('keydown',event=>{
        const items=[...downloadMenu.querySelectorAll('button:not(:disabled)')],index=items.indexOf(document.activeElement);
        if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?items.length-1:(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next]?.focus();}
        if(event.key==='Escape'){event.preventDefault();closeDownloadMenu(true);}
        if(event.key==='Tab')closeDownloadMenu(true);
      });
      document.addEventListener('pointerdown',event=>{if(!downloadControl.contains(event.target))closeDownloadMenu();});
      window.addEventListener('blur',()=>closeDownloadMenu());
      fetch(apiUrl('/downloads'),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(data=>{downloadState.capabilities=data.decks||[];syncDownloads();}).catch(()=>{});

      function fileLabel(file) {
        return file.replace(/\.(png|jpe?g|webp|html)$/i, "");
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[char];
        });
      }

      function formatTime(value) {
        return new Intl.DateTimeFormat("ru-RU", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(new Date(value));
      }

      function sourceForSlide(slide) {
        if (state.contractVersion === 1) {
          const { html, png } = slide.artifacts;
          if (html.state === "available") return { kind: "html", url: html.url };
          if (html.state === "unreadable") return { kind: "unavailable", message: "HTML preview is unavailable." };
          if (png.state === "available") return { kind: "image", url: png.url };
          return { kind: "unavailable", message: png.state === "unreadable" ? "Preview is unavailable." : "Preview has not been generated." };
        }
        if (slide.htmlError) return { kind: "unavailable", message: "HTML preview is unavailable." };
        if (slide.htmlUrl) {
          return {
            kind: "html",
            url: slide.htmlUrl,
            file: slide.htmlFile,
            modifiedAt: slide.htmlModifiedAt,
          };
        }

        if (slide.imageError) return { kind: "unavailable", message: "Preview is unavailable." };
        if (!slide.url) return { kind: "unavailable", message: "Preview has not been generated." };
        return {
          kind: "image",
          url: slide.url,
          file: slide.file,
          modifiedAt: slide.modifiedAt,
        };
      }

      function displayNumber(slide) {
        return state.contractVersion === 1 ? slide.number : slide.no;
      }

      function slideHash(slide) {
        if (state.contractVersion !== 1) return `#${slide.id}`;
        return `#project/${state.project.id}/deck/${state.deckId}/slide/${slide.id}`;
      }

      function hashTarget(decks) {
        if (state.contractVersion === 1) {
          const match = location.hash.match(/^#project\/([^/]+)\/deck\/([^/]+)(?:\/slide\/([^/]+))?$/);
          if (!match || match[1] !== state.project.id) return null;
          const deck = decks.find(item => item.id === match[2]);
          return deck && (!match[3] || deck.slides.some(slide => slide.id === match[3])) ? { deck, slideId: match[3] || "" } : null;
        }
        const id = location.hash.slice(1);
        const deck = decks.find(item => item.slides.some(slide => slide.id === id));
        return deck ? { deck, slideId: id } : null;
      }

      function slideScopeId(slide) {
        return `slide-scope-${String(slide.id || slide.no || "unknown")
          .toLowerCase()
          .replace(/[^a-z0-9_-]+/g, "-")
          .replace(/^-+|-+$/g, "")}`;
      }

      function splitSelectorList(selectorText) {
        const selectors = [];
        let start = 0;
        let depth = 0;
        let quote = "";
        let escaped = false;

        for (let index = 0; index < selectorText.length; index += 1) {
          const char = selectorText[index];

          if (escaped) {
            escaped = false;
            continue;
          }

          if (char === "\\") {
            escaped = true;
            continue;
          }

          if (quote) {
            if (char === quote) quote = "";
            continue;
          }

          if (char === '"' || char === "'") {
            quote = char;
            continue;
          }

          if (char === "(" || char === "[") depth += 1;
          if (char === ")" || char === "]") depth = Math.max(0, depth - 1);

          if (char === "," && depth === 0) {
            selectors.push(selectorText.slice(start, index).trim());
            start = index + 1;
          }
        }

        selectors.push(selectorText.slice(start).trim());
        return selectors.filter(Boolean);
      }

      function scopeSingleSelector(selector, scopeSelector) {
        const trimmed = selector.trim();
        if (!trimmed) return trimmed;

        if (/^(html|body|:root)$/.test(trimmed)) {
          return scopeSelector;
        }

        const remappedDocumentSelector = trimmed.replace(
          /(^|[\s>+~,(])(:root|html|body)(?=[:.#\s>+~,[)]|$)/g,
          (_, prefix) => `${prefix}${scopeSelector}`
        );

        if (remappedDocumentSelector !== trimmed) {
          return remappedDocumentSelector;
        }

        return `${scopeSelector} ${trimmed}`;
      }

      function scopeSelectorText(selectorText, scopeSelector) {
        return splitSelectorList(selectorText)
          .map((selector) => scopeSingleSelector(selector, scopeSelector))
          .join(", ");
      }

      function rewriteCssRules(ruleList, scopeSelector) {
        return Array.from(ruleList)
          .map((rule) => {
            if (rule.type === CSSRule.STYLE_RULE) {
              return `${scopeSelectorText(rule.selectorText, scopeSelector)} { ${rule.style.cssText} }`;
            }

            if (rule.type === CSSRule.MEDIA_RULE) {
              return `@media ${rule.conditionText} { ${rewriteCssRules(rule.cssRules, scopeSelector)} }`;
            }

            if (rule.type === CSSRule.SUPPORTS_RULE) {
              return `@supports ${rule.conditionText} { ${rewriteCssRules(rule.cssRules, scopeSelector)} }`;
            }

            if ("cssRules" in rule && rule.cssRules && rule.conditionText) {
              return `${rule.cssText.slice(0, rule.cssText.indexOf("{") + 1)} ${rewriteCssRules(
                rule.cssRules,
                scopeSelector
              )} }`;
            }

            return rule.cssText;
          })
          .join("\n");
      }

      function fallbackScopeCss(cssText, scopeSelector) {
        return cssText.replace(/(^|})\s*([^@{}][^{}]*)\{/g, (match, close, selectorText) => {
          return `${close} ${scopeSelectorText(selectorText, scopeSelector)} {`;
        });
      }

      function absoluteSourceUrl(sourceUrl) {
        try {
          return new URL(sourceUrl, window.location.href).href;
        } catch {
          return sourceUrl;
        }
      }

      function resolveCssUrls(cssText, sourceUrl) {
        const baseUrl = absoluteSourceUrl(sourceUrl);
        return cssText.replace(/url\(\s*(['"]?)(?!data:|blob:|https?:|#|\/)([^'")]+)\1\s*\)/gi, (match, quote, url) => {
          try {
            return `url(${quote}${new URL(url, baseUrl).href}${quote})`;
          } catch {
            return match;
          }
        });
      }

      function rewriteCssText(cssText, scopeId, sourceUrl) {
        const scopeSelector = `[data-slide-scope="${scopeId}"]`;
        const cssWithResolvedUrls = resolveCssUrls(cssText, sourceUrl);

        try {
          const sheet = new CSSStyleSheet();
          sheet.replaceSync(cssWithResolvedUrls);
          return rewriteCssRules(sheet.cssRules, scopeSelector);
        } catch (error) {
          console.warn("Falling back to simple CSS scoping", error);
          return fallbackScopeCss(cssWithResolvedUrls, scopeSelector);
        }
      }

      function absolutizeUrl(value, sourceUrl) {
        if (!value || /^(data:|blob:|https?:|mailto:|#|\/)/i.test(value)) return value;

        try {
          return new URL(value, absoluteSourceUrl(sourceUrl)).href;
        } catch {
          return value;
        }
      }

      function normalizeSlideDocument(fragmentHtml, scopeId, sourceUrl) {
        const documentForSlide = new DOMParser().parseFromString(fragmentHtml, "text/html");

        documentForSlide.querySelectorAll("script").forEach((node) => node.remove());
        documentForSlide.querySelectorAll("[src]").forEach((node) => {
          node.setAttribute("src", absolutizeUrl(node.getAttribute("src"), sourceUrl));
        });
        documentForSlide.querySelectorAll("[href]").forEach((node) => {
          node.setAttribute("href", absolutizeUrl(node.getAttribute("href"), sourceUrl));
        });

        const cssText = Array.from(documentForSlide.querySelectorAll("style"))
          .map((node) => node.textContent || "")
          .join("\n");
        documentForSlide.querySelectorAll("style").forEach((node) => node.remove());

        const scopedStyle = cssText
          ? `<style data-slide-scoped-style="${scopeId}">${rewriteCssText(cssText, scopeId, sourceUrl)}</style>`
          : "";
        return `${scopedStyle}${documentForSlide.body.innerHTML}`;
      }

      function staticSlideDocument(html, sourceUrl) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        if (inspectStaticDocument(doc).length) throw new Error('HTML requires static preparation');
        let base = doc.querySelector('base[href]');
        if (base && new URL(base.getAttribute('href'), absoluteSourceUrl(sourceUrl)).protocol === 'file:') throw new Error('File base cannot be previewed over HTTP');
        if (!base) { base = doc.createElement('base'); base.href = absoluteSourceUrl(sourceUrl); doc.head.prepend(base); }
        else base.href = new URL(base.getAttribute('href'), absoluteSourceUrl(sourceUrl)).href;
        return '<!doctype html>' + doc.documentElement.outerHTML;
      }

      async function loadDocumentFrame(holder, html, sourceUrl) {
        const frame = document.createElement('iframe');
        frame.className = 'html-document-frame'; frame.title = 'Slide preview';
        frame.setAttribute('sandbox', 'allow-same-origin'); frame.setAttribute('scrolling', 'no');
        frame.style.visibility = 'hidden'; frame.style.position = 'absolute'; frame.style.inset = '0';
        const documentHtml = staticSlideDocument(html, sourceUrl);
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => { frame.remove(); reject(new Error('HTML preview timeout')); }, 30000);
          frame.onload = async () => {
            try {
              const doc = frame.contentDocument;
              if (!doc) throw new Error('Unavailable preview document');
              await doc.fonts?.ready;
              const images = await Promise.all([...doc.images].map(image => image.decode().then(() => true, () => false)));
              if (inspectStaticDocument(doc).length) throw new Error('HTML requires static preparation');
              if (images.some(loaded => !loaded) || [...doc.fonts].some(font => font.status === 'error') ||
                [...doc.querySelectorAll('link[rel="stylesheet"]')].some(link => !link.sheet)) throw new Error('HTML resource failed');
              const failedResource = frame.contentWindow.performance.getEntriesByType('resource').some(entry => {
                const url = new URL(entry.name, location.href);
                return entry.responseStatus >= 400 || entry.responseStatus === 0 && url.origin === location.origin && /^https?:$/.test(url.protocol);
              });
              if (failedResource) throw new Error('HTML resource failed');
              frame.style.visibility = '';
              [...holder.children].forEach(child => { if (child !== frame) child.remove(); });
              resolve();
            } catch (error) { frame.remove(); reject(error); }
            finally { clearTimeout(timeout); }
          };
          frame.srcdoc = documentHtml; holder.append(frame);
        });
      }

      function mediaMarkup(slide) {
        const source = sourceForSlide(slide);
        const slideNo = escapeHtml(displayNumber(slide));
        if (source.kind === "unavailable") return `<div class="html-inline-error" role="status">${escapeHtml(source.message)}</div>`;
        const slideUrl = escapeHtml(source.url);

        if (source.kind === "html") {
          const scopeId = slideScopeId(slide);
          return `<div class="html-inline" data-width="${slide.width || 1920}" data-height="${slide.height || 1080}" data-frag="${slideUrl}" data-scope="${scopeId}"><div class="html-inline-holder" data-slide-scope="${scopeId}"></div></div>`;
        }

        return `<img data-preview-image data-preview-source="${slideUrl}" src="${slideUrl}" alt="Slide ${slideNo}" decoding="async" />`;
      }

      function syncHtmlFrameScale() {
        document.querySelectorAll(".html-inline").forEach((preview) => {
          const holder = preview.querySelector(".html-inline-holder");
          if (!holder) return;

          const fragUrl = preview.dataset.frag;
          if (fragUrl && preview.dataset.loaded !== fragUrl) {
            preview.dataset.loaded = fragUrl;
            preview.dataset.pending = "true";
            fetch(fragUrl, { cache: "no-store", signal: AbortSignal.timeout(30000) })
              .then((response) => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.text();
              })
              .then(async (fragmentHtml) => {
                if (!fragmentHtml.trim()) throw new Error("Empty HTML preview");
                if (state.contractVersion === 1) await loadDocumentFrame(holder, fragmentHtml, fragUrl);
                else holder.innerHTML = normalizeSlideDocument(fragmentHtml, preview.dataset.scope, fragUrl);
                delete preview.dataset.failed;
                syncHtmlFrameScale();
              })
              .catch(() => {
                preview.dataset.failed = "true";
                holder.innerHTML = '<div class="html-inline-error" role="alert">Failed to load HTML preview.</div>';
              })
              .finally(() => { delete preview.dataset.pending; });
          }

          const rect = preview.getBoundingClientRect();
          const frameWidth = Number(preview.dataset.width) || 1920;
          const frameHeight = Number(preview.dataset.height) || 1080;
          const scale = Math.min(rect.width / frameWidth, rect.height / frameHeight);
          holder.style.transform = `scale(${scale})`;
        });
      }

      function scheduleHtmlFrameScale() {
        requestAnimationFrame(syncHtmlFrameScale);
      }

      function retryPreviewFailures() {
        // Retry only after a healthy API poll, at most once per poll and URL.
        // Keep the current error visible while the next request is pending.
        document.querySelectorAll('.html-inline[data-failed="true"]').forEach(preview => {
          if (!preview.dataset.pending) preview.dataset.loaded = "";
        });
        document.querySelectorAll('.stage > img[data-preview-image][data-failed="true"]').forEach(image => {
          if (image.dataset.retrying) return;
          image.dataset.retrying = "true";
          const url = new URL(image.dataset.previewSource, location.href);
          url.searchParams.set("previewRetry", String(Date.now()));
          image.src = url.href;
        });
        scheduleHtmlFrameScale();
      }

      function setMode(mode) {
        state.mode = mode;
        wheelState.consumed = false;
        wheelState.distance = 0;
        wheelState.lastEvent = 0;
        storage.setItem(`${storagePrefix}Mode`, mode);
        app.classList.toggle("focus-mode", mode === "focus");
        app.classList.toggle("deck-mode", mode === "deck");
        focusButton.setAttribute("aria-pressed", String(mode === "focus"));
        deckButton.setAttribute("aria-pressed", String(mode === "deck"));
        scheduleHtmlFrameScale();
      }

      function setIndex(index) {
        if (!state.slides.length) {
          state.index = 0;
          return;
        }

        const slideCount = state.slides.length;
        state.index = (index + slideCount) % slideCount;
        storage.setItem(`${storagePrefix}Index:${state.deckId}`, String(state.index));
        if (state.contractVersion === 1) storage.setItem(`${storagePrefix}Slide:${state.deckId}`, state.slides[state.index].id);
        renderActiveState();
      }

      function openSlide(index) {
        setMode("focus");
        setIndex(index);
      }

      function scrollActiveTabIntoView() {
        const activeTab = jumpRoot.querySelector(`.slide-tab[data-index="${state.index}"]`);
        if (!activeTab) {
          syncSlideIndicator();
          return;
        }
        // Scroll only the number strip; scrolling its ancestors would move the deck grid.
        const left = activeTab.offsetLeft - 44;
        const right = activeTab.offsetLeft + activeTab.offsetWidth + 44;
        if (left < jumpRoot.scrollLeft) jumpRoot.scrollLeft = Math.max(0, left);
        else if (right > jumpRoot.scrollLeft + jumpRoot.clientWidth) {
          jumpRoot.scrollLeft = right - jumpRoot.clientWidth;
        }
        syncSlideIndicator({ navigation: true });
      }

      function renderActiveState() {
        const active = state.slides[state.index];

        document.querySelectorAll(".slide-card").forEach((node) => {
          node.classList.toggle("is-active", node.dataset.index === String(state.index));
        });

        document.querySelectorAll(".slide-tab").forEach((node) => {
          node.setAttribute("aria-current", String(node.dataset.index === String(state.index)));
        });

        requestAnimationFrame(scrollActiveTabIntoView);

        if (active) {
          history.replaceState(null, "", slideHash(active));
        } else if (state.contractVersion === 1) {
          const hash = state.deckId ? `#project/${state.project.id}/deck/${state.deckId}` : "";
          history.replaceState(null, "", location.pathname + location.search + hash);
        }
        scheduleHtmlFrameScale();
        window.dispatchEvent(new Event('deckloom:change'));
      }

      function renderSlides() {
        resetDockMagnification();
        if (!state.slides.length) {
          slidesRoot.innerHTML = `<div class="empty">${state.decks.length ? "This presentation has no slides." : "This project has no presentations."}</div>`;
          jumpRoot.innerHTML = "";
          renderActiveState();
          return;
        }

        jumpRoot.innerHTML = state.slides
          .map((slide, index) => {
            return `<button class="slide-tab" type="button" data-index="${index}" aria-label="Слайд ${escapeHtml(displayNumber(slide))}"><span class="slide-number">${escapeHtml(displayNumber(slide))}</span></button>`;
          })
          .join("");

        slidesRoot.innerHTML = state.slides
          .map((slide, index) => {
            return `
              <section class="slide-card" style="--slide-width:${Number(slide.width) || 1920}px;--slide-height:${Number(slide.height) || 1080}px;--slide-aspect:${(Number(slide.width) || 1920) / (Number(slide.height) || 1080)}" id="${escapeHtml(state.contractVersion === 1 ? `card-${state.deckId}-${slide.id}` : slide.id)}" data-index="${index}" role="button" tabindex="0" aria-label="Open slide ${escapeHtml(displayNumber(slide))}">
                <div class="stage">
                  ${mediaMarkup(slide)}
                </div>
              </section>
            `;
          })
          .join("");

        document.querySelectorAll(".slide-tab").forEach((button) => {
          button.addEventListener("click", () => {
            openSlide(Number(button.dataset.index));
          });
        });

        document.querySelectorAll(".slide-card").forEach((card) => {
          card.addEventListener("click", () => {
            if (state.mode !== "deck") return;
            const selection = window.getSelection();
            if (selection && !selection.isCollapsed && card.contains(selection.anchorNode)) return;
            openSlide(Number(card.dataset.index));
          });

          card.addEventListener("keydown", (event) => {
            if (state.mode !== "deck") return;
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            openSlide(Number(card.dataset.index));
          });
        });

        document.querySelectorAll(".stage > img[data-preview-image]").forEach((image) => {
          const failed = () => {
            delete image.dataset.retrying;
            if (image.dataset.failed) return;
            image.dataset.failed = "true";
            image.style.display = "none";
            const error = document.createElement("div");
            error.className = "html-inline-error";
            error.dataset.imageError = "true";
            error.setAttribute("role", "alert");
            error.textContent = "Failed to load image preview.";
            image.parentElement.append(error);
          };
          image.addEventListener("error", failed);
          image.addEventListener("load", () => {
            delete image.dataset.failed;
            delete image.dataset.retrying;
            image.style.display = "";
            image.parentElement.querySelector('[data-image-error="true"]')?.remove();
          });
          if (image.complete && !image.naturalWidth) failed();
        });

        renderActiveState();
        scheduleHtmlFrameScale();
      }

      function deckSignature(deck, contractVersion = state.contractVersion) {
        if (contractVersion === 1) return JSON.stringify(deck);
        return [
          deck.id,
          deck.label,
          deck.width, deck.height,
          JSON.stringify(deck.build || {}),
          ...(deck.slides || []).map((slide) =>
            `${slide.width}:${slide.height}:${slide.id}:${slide.file}:${slide.version}:${slide.htmlFile || ""}:${slide.htmlVersion || ""}:${slide.htmlError || ""}:${slide.imageError || ""}`
          ),
        ].join("|");
      }

      function renderDeckOptions() {
        deckSelect.innerHTML = state.decks
          .map((deck) => `<option value="${escapeHtml(deck.id)}">${escapeHtml(deck.label)}</option>`)
          .join("");
        deckSelect.value = state.deckId;
        const label = state.decks.find((deck) => deck.id === state.deckId)?.label || "Выбрать презентацию";
        deckTitleNode.textContent = label;
        deckSelect.title = label;
        syncDownloads();
      }

      function updateDeckStatus() {
        const build = state.decks.find(deck => deck.id === state.deckId)?.build;
        const attempt = build?.latestAttempt;
        const previous = build?.buildId ? ' · показана опубликованная сборка' : '';
        statusNode.textContent = build?.state === 'unreadable' ? 'Не удалось прочитать состояние сборки'
          : attempt?.state === 'failed' ? `Сборка завершилась с ошибкой${previous}`
          : attempt?.state === 'cancelled' ? `Сборка отменена${previous}`
          : attempt?.state === 'building' ? `Сборка выполняется${previous}`
          : attempt?.diagnostics?.length ? 'Сборка с замечаниями'
          : state.generatedAt ? `Обновлено ${formatTime(state.generatedAt)}` : '';
      }

      function activateDeck(deckId, options = {}) {
        closeDownloadMenu();
        const deck = state.decks.find((item) => item.id === deckId) || state.decks[0];
        if (!deck) {
          state.deckId = "";
          state.slides = [];
          state.index = 0;
          renderDeckOptions();
          renderSlides();
          updateDeckStatus();
          return;
        }

        const previousDeckId = state.deckId;
        const previousActiveId = previousDeckId === deck.id ? state.slides[state.index]?.id : "";
        state.deckId = deck.id;
        app.style.setProperty("--slide-aspect", (deck.width || 1920) / (deck.height || 1080));
        wheelState.consumed = false;
        wheelState.lastEvent = 0;
        wheelState.distance = 0;
        state.slides = deck.slides || [];
        state.signature = deckSignature(deck);
        storage.setItem(`${storagePrefix}Deck`, state.deckId);
        renderDeckOptions();

        const preferredId = options.preferredSlideId || previousActiveId || (state.contractVersion === 1 ? storage.getItem(`${storagePrefix}Slide:${state.deckId}`) : "");
        const preferredIndex = state.slides.findIndex((slide) => slide.id === preferredId);
        const legacyIndex = state.deckId === config.legacyDeckId ? storage.getItem(`${storagePrefix}Index`) : null;
        const storedIndex = Number(
          storage.getItem(`${storagePrefix}Index:${state.deckId}`) || legacyIndex || 0
        );
        state.index = preferredIndex >= 0
          ? preferredIndex
          : Math.max(0, Math.min(Number.isFinite(storedIndex) ? storedIndex : 0, Math.max(state.slides.length - 1, 0)));

        app.classList.toggle("many-slides", state.slides.length >= 24);
        renderSlides();
        updateDeckStatus();
      }

      async function loadSlides(options = {}) {
        if (state.presenting || state.requestInFlight || state.updatesHeld && !options.review && !options.apply) return;
        state.requestInFlight = true;
        const epoch = state.readEpoch;
        readAbort = new AbortController();

        try {
          const response = await fetch(apiUrl(`/decks?ts=${Date.now()}`), {
            cache: "no-store",
            signal: AbortSignal.any([readAbort.signal, AbortSignal.timeout(30000)]),
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const payload = await response.json();
          if (epoch !== state.readEpoch) return;
          if (payload.contractVersion !== undefined && payload.contractVersion !== 1) throw new Error("Unsupported read contract version");
          const signature = (payload.decks || []).map(deck => deckSignature(deck, payload.contractVersion === 1 ? 1 : 0)).join("||");
          if (state.updatesHeld && !options.apply && signature !== state.decksSignature) {
            window.dispatchEvent(new CustomEvent('deckloom:updates', { detail: { available: true } }));
            return;
          }
          state.updatesHeld = false;
          window.dispatchEvent(new CustomEvent('deckloom:updates', { detail: { available: false } }));
          state.contractVersion = payload.contractVersion === 1 ? 1 : 0;
          state.project = state.contractVersion === 1 ? payload.project : null;
          const decks = payload.decks || [];

          app.classList.remove("is-loading");
          state.generatedAt = payload.generatedAt;

          if (signature !== state.decksSignature) {
            const activeId = state.slides[state.index]?.id || "";
            const target = hashTarget(decks);
            state.decks = decks;
            state.decksSignature = signature;

            const savedDeck = decks.find((deck) => deck.id === state.deckId);
            const targetDeck = target?.deck || savedDeck || decks[0];
            const preferredSlideId = target ? target.slideId : activeId;

            activateDeck(targetDeck?.id, { preferredSlideId });
          } else {
            updateDeckStatus();
          }
          retryPreviewFailures();
        } catch (error) {
          if (epoch !== state.readEpoch) return;
          app.classList.remove("is-loading");
          statusNode.textContent = `Сервер недоступен: ${error.message}`;
          if (state.updatesHeld) window.dispatchEvent(new CustomEvent('deckloom:updates', { detail: { error: true } }));
        } finally {
          if (epoch === state.readEpoch) state.requestInFlight = false;
        }
      }

      function holdPresentation(active) {
        state.presenting = active;
        state.updatesHeld = true;
        state.readEpoch++;
        readAbort?.abort();
        state.requestInFlight = false;
        if (!active) {
          if (config.published) state.updatesHeld = false;
          else loadSlides({ review: true });
        }
      }

      deckSelect.addEventListener("change", () => activateDeck(deckSelect.value));
      focusButton.addEventListener("click", () => setMode("focus"));
      deckButton.addEventListener("click", () => setMode("deck"));
      window.addEventListener("resize", () => {
        resetDockMagnification();
        requestAnimationFrame(scrollActiveTabIntoView);
        syncViewerHeight();
      });

      app.addEventListener("wheel", (event) => {
        if (state.presenting) return;
        if (state.mode !== "focus" || state.slides.length < 2) return;
        if (event.ctrlKey || event.metaKey || event.altKey || event.defaultPrevented) return;
        if (event.target.closest(".topbar, .slide-dock, input, select, textarea, button, a, [contenteditable], [role='slider']")) return;
        const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
        if (!delta) return;
        event.preventDefault();
        const now = performance.now();
        const direction = Math.sign(delta);
        if (now - wheelState.lastEvent > 180 || direction !== wheelState.direction) {
          wheelState.distance = 0;
          wheelState.consumed = false;
        }
        wheelState.lastEvent = now;
        wheelState.direction = direction;
        if (wheelState.consumed) return;
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
        wheelState.distance += Math.abs(delta) * unit;
        if (wheelState.distance < 32) return;
        wheelState.consumed = true;
        setIndex(state.index + direction);
      }, { passive: false });

      document.addEventListener("keydown", (event) => {
        if (state.presenting) return;
        if (event.altKey || event.ctrlKey || event.metaKey || event.defaultPrevented || event.isComposing || event.keyCode === 229) return;
        if (event.target.closest("input, select, textarea, [contenteditable]")) return;
        if(event.target.closest('.download-control'))return;
        if (event.key === " " && event.target.closest("button, a")) return;

        if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          setMode("focus");
          setIndex(state.index - 1);
        }

        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          setMode("focus");
          setIndex(state.index + 1);
        }
      });

      window.addEventListener("hashchange", () => {
        if (state.presenting || state.updatesHeld) return;
        const target = hashTarget(state.decks);
        if (!target) return;
        if (target.deck.id !== state.deckId) {
          activateDeck(target.deck.id, { preferredSlideId: target.slideId });
          return;
        }
        const index = state.slides.findIndex((slide) => slide.id === target.slideId);
        if (index >= 0) setIndex(index);
      });

      window.deckloomViewer = { state, openSlide, setMode, setIndex, holdPresentation,
        refresh: () => loadSlides({ apply: true }), checkUpdates: () => loadSlides({ review: true }), sourceForSlide, loadDocumentFrame };
      setMode(state.mode === "deck" ? "deck" : "focus");
      loadSlides();
      if(!config.published)setInterval(() => loadSlides(), 1000);
    </script>
